# XAiWebHook 请求记录图片样式配置（独立于 webhook_config.yml）
# 修改保存后约 1~2 秒自动生效，无需重启插件或执行 /xwebhook reload。
# 无效配置不会被应用：继续使用上一份有效样式，并在日志与 /xwebhook imageconfig 中显示错误。
# 字段可按需省略（至少保留一个字段，如 version: 1）；省略时使用下方默认值，不允许未知字段、重复字段或 null。
# 颜色必须加引号，格式为 "#RRGGBB"（不透明）或 "#AARRGGBB"（alpha 在前，00 为全透明）。

# 配置格式版本。默认 1，目前仅支持 1。
version: 1

# 原截图外框。
border:
  # 是否绘制外框。默认 true；false 时不绘制线条，也不增加边框内边距。
  enabled: true
  # 外框线宽（像素）。默认 1，整数 0..16；0 表示不绘制线条。
  width_px: 1
  # 原截图与外框之间的内边距（像素）。默认 2，整数 0..128。
  padding_px: 2
  # 外框颜色。默认 "#FF3B30"。
  color: "#FF3B30"

# 左侧成功率百分比副本。
percentage:
  # 是否截取并在左侧复制成功率百分比。默认 true；false 时不再截取该元素。
  enabled: true
  # 左侧百分比与原截图外框之间的间距（像素）。默认 6，整数 0..256；仅存在左侧副本时计入。
  gap_px: 6
  # 百分比竖向对齐方式。默认 "center"，可选 "top"、"center"、"bottom"。
  vertical_align: "center"

# 外侧留白。百分数以加留白之前的完整内容尺寸为基准，每侧向上取整。
margin:
  # 左侧留白占内容宽度的百分比。默认 5.0，有限数字 0..50；0 表示关闭该侧留白。
  left_percent: 5.0
  # 右侧留白占内容宽度的百分比。默认 5.0，有限数字 0..50；0 表示关闭该侧留白。
  right_percent: 5.0
  # 顶部留白占内容高度的百分比。默认 1.0，有限数字 0..50；0 表示关闭该侧留白。
  top_percent: 1.0
  # 底部留白占内容高度的百分比。默认 1.0，有限数字 0..50；0 表示关闭该侧留白。
  bottom_percent: 1.0
  # 非零比例时每侧的最小留白（像素）。默认 1，整数 0..128。
  min_px: 1

# 背景颜色。
background:
  # 外侧留白颜色。默认白色 "#FFFFFF"。
  margin_color: "#FFFFFF"
  # 内容区新增间隙/内边距的底色。默认 "auto"（取原截图左上角像素），也可填写固定颜色。
  content_color: "auto"

# 输出限制。
output:
  # 合成画布的像素总量上限（宽 x 高），创建画布前检查。默认 16000000，整数 1..64000000。
  # 截图字节上限仍由 webhook_config.yml 的 browser.max_screenshot_bytes 控制。
  max_pixels: 16000000
