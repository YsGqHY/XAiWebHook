# XAiWebHook 默认配置
# 本文件首次启动时自动生成。修改后执行 /xwebhook reload 即可热重载，无需重启 mirai。
# 所有 ${...} 表达式仅做变量替换与基础条件判断，不会执行任意脚本。

# HTTP 服务（接收外部 incoming 请求）相关设置
server:
  # 是否启动 HTTP 服务，false 时仅 outgoing 转发可用
  enabled: true
  # 监听地址。默认仅监听本机；需要接收外部请求时改为 "0.0.0.0"，
  # 并务必配置强 token（auth.tokens），避免接口在公网裸奔
  host: "127.0.0.1"
  # 监听端口，取值范围 1-65535
  port: 18080
  # 所有 incoming 端点的统一路径前缀，最终路径 = base_path + 端点 path
  base_path: "/webhook"

# incoming 请求鉴权设置
auth:
  # 鉴权类型，目前仅支持 "bearer"；其它值会导致所有请求被拒
  type: "bearer"
  # 全局 Bearer Token 列表。端点未单独配置 tokens 时回退到此处。
  # 生产环境务必替换默认值，使用足够长的随机串
  tokens:
    - "change-me-token"
  # 为 true 时允许无 token 端点，但仅放行来自回环地址的请求
  # （127.0.0.0/8 网段、localhost、::1 等）。绑定非回环 host 时开启会触发安全告警
  allow_empty_for_localhost: false

# 表达式模板设置
templates:
  # 是否启用 ${...} 表达式。为 false 时模板原样输出
  enable_expressions: true
  # 未解析到变量时的处理：true 保留原始 ${...} 文本，false 替换为空串
  strict_missing_variables: false

# 浏览器自动化设置，用于 send_webpage_screenshot 动作
browser:
  # 浏览器动作总开关，默认 false；启用截图动作前必须改为 true
  enabled: true
  # 浏览器引擎，可选 chromium、firefox、webkit；使用 Edge/Chrome channel 时必须为 chromium
  engine: "chromium"
  # 浏览器发行通道。Windows 可用 msedge 复用系统 Edge；留空则使用 Playwright 默认浏览器
  channel: "msedge"
  # 自定义浏览器可执行文件路径，默认留空；配置后优先于 channel
  executable_path: ""
  # 浏览器功能专用 HTTP(S) 代理，覆盖 Playwright 页面、认证 APIRequest 与 CLI Bridge 请求；留空表示直连
  # 支持 http://127.0.0.1:7890、https://127.0.0.1:7890，也可写为 http://user:password@127.0.0.1:7890
  proxy: ""
  # 是否无界面运行，默认 true；调试登录流程时可临时改为 false
  headless: true
  # 浏览器视口宽度，默认 1440，范围 320-7680
  viewport_width: 1440
  # 浏览器视口高度，默认 1000，范围 240-4320
  viewport_height: 1000
  # 浏览器步骤与导航默认超时（毫秒），默认 30000，范围 1000-300000
  timeout_ms: 30000
  # optional 步骤查找元素的最大等待时间（毫秒），默认 1000，范围 100-30000
  optional_step_timeout_ms: 1000
  # 是否持久化 session_key 对应的 Cookie/localStorage，省略时默认 false；
  # 缓存含敏感登录态，默认保持关闭；确需跨 reload/重启恢复登录时再启用并限制目录访问权限
  session_cache_enabled: false
  # 会话缓存目录，默认 browser-session-cache；相对路径基于插件配置目录，文件名使用 session_key 哈希
  session_cache_dir: "browser-session-cache"
  # 允许主页面访问的域名列表；支持精确域名和 *.example.com 子域通配，不能为空
  allowed_hosts:
    - "hk.geek2api.com"
    - "hk2.geek2api.com"
    - "hk3.geek2api.com"
    - "hk4.geek2api.com"
    - "hk5.geek2api.com"
  # 单张截图最大字节数，默认 10485760（10 MiB），范围 1024-52428800
  max_screenshot_bytes: 10485760

# 安全相关设置
security:
  # 命令执行全局开关。execute_command 动作需同时开启此项与动作自身 enabled 才会执行
  allow_command_execution: false
  # incoming 请求体最大字节数，超限返回 413；0 表示不限制
  max_body_bytes: 1048576

# 日志设置
logging:
  # 是否记录 incoming/outgoing 请求日志
  request: true
  # 是否记录 incoming 响应日志
  response: true
  # 是否记录错误堆栈
  error_stacktrace: true
  # 是否输出调试日志（各功能节点的详细 println，含配置/请求/动作/事件全过程）。
  # 默认 false；排查问题时开启，会在控制台打印大量信息，生产环境建议关闭
  debug: false

# Model Plaza 查询设置（Geek2Api 模型广场功能）
model_plaza:
  # 是否启用 Model Plaza 查询功能，默认 false
  enabled: false
  # Geek2Api 入口 URL；程序会访问同入口的 /api/v1/model-plaza，并按 hk → hk2 → hk3 → hk4 → hk5 故障转移
  base_url: "https://hk.geek2api.com/model-plaza"
  # API 查询超时时间（毫秒），默认 30000，范围 5000-120000
  timeout_ms: 30000
  # Model Plaza 功能专用 HTTP(S) 代理，覆盖业务 API、CLI Bridge、用户信息与 Token 刷新；留空表示直连
  # 支持 http://127.0.0.1:7890、https://127.0.0.1:7890，以及 URL 中的可选用户名密码
  proxy: ""
  # 查询行为配置；models 负责“模型”查询，groups 负责“分组”查询。
  # action 内的 query_pattern、pending_message、failure_message、empty_message、success_template
  # 优先级高于这里的对应配置，便于同一数据源配置多条不同路由。
  queries:
    models:
      keyword_extraction:
        # 自动提取时按顺序移除一个前缀；默认兼容“模型/分组/model/group”
        remove_prefixes: ["模型", "分组", "model", "group"]
        # 可选正则；填写后取 capture_group 捕获组，留空表示仅移除前缀
        pattern: ""
        # 正则捕获组编号，默认 1，范围 0-20
        capture_group: 1
        # 是否去除关键词首尾空白，默认 true
        trim: true
        # 是否转为小写，默认 false；接口匹配本身不区分大小写
        lowercase: false
        # 是否要求命中上述前缀，默认 true；避免普通聊天文本触发查询
        require_prefix_match: true
      # 可选过滤器；不配置时不限制查询词
      # filters:
      #   blacklist:
      #     enabled: true
      #     keywords: ["禁止词"]
      #     case_sensitive: false
      #     reject_message: "关键词“${keyword}”不允许查询"
      #   whitelist:
      #     enabled: true
      #     keywords: ["允许词"]
      #     case_sensitive: false
      #     reject_message: "关键词“${keyword}”不在允许列表中"
      #   length:
      #     min: 1
      #     max: 100
      #     reject_message: "关键词长度必须在 ${min}-${max} 之间"
      #   pattern:
      #     regex: "^[\\p{L}\\p{N} ._-]+$"
      #     reject_message: "关键词格式不正确"
      # 结果排序：source 保持接口顺序，alphabetical 按名称排序；默认 source
      sort: "source"
      # 顶层结果最多显示多少项，0 表示不限制，范围 0-100
      limit: 0
      # 每项关联模型最多显示多少个，0 表示不限制，范围 0-100
      max_related_items: 0
      response_format:
        # 查询中提示语；支持 ${query} 和事件模板变量
        pending_message: "正在查询分组模型，请稍候..."
        # 查询失败提示语
        failure_message: "查询失败，请稍后重试"
        # 无结果提示语
        empty_message: "未找到包含该关键词的分组"
        # 成功模板支持 foreach、if/else、format_number 等安全模板语法
        success_template: |
          包含“${query}”的分组（共 ${count} 个）：
          ${foreach relation in relations}
          分组：${relation.groupName}
          ${if relation.models}
          ${foreach model in relation.models}- ${model.name}
          ${endforeach}
          ${else}- （无可用模型）
          ${endif}
          ${endforeach}
    groups:
      keyword_extraction:
        # 自动提取时按顺序移除一个前缀；默认兼容“模型/分组/model/group”
        remove_prefixes: ["模型", "分组", "model", "group"]
        pattern: ""
        capture_group: 1
        trim: true
        lowercase: false
        require_prefix_match: true
      # 与 models 相同：可配置 filters、sort、limit、max_related_items
      sort: "source"
      limit: 0
      max_related_items: 0
      response_format:
        pending_message: "正在查询模型分组，请稍候..."
        failure_message: "查询失败，请稍后重试"
        empty_message: "未找到包含该关键词的模型"
        success_template: |
          包含“${query}”的模型（共 ${count} 个）：
          ${foreach relation in relations}
          模型：${relation.modelName}
          ${if relation.groups}
          ${foreach group in relation.groups}- ${group.name}
          ${endforeach}
          ${else}- （无可用分组）
          ${endif}
          ${endforeach}
  # CLI Bridge 认证配置；接口请求会携带登录 JWT，并复用原 playwright-storage-state.json 中的 Cookie，响应更新会原子回写
  # 使用 CLI Bridge 在系统浏览器中登录，无需在配置中存储密码
  auth:
    # CLI Bridge 会话发起接口
    start_url: "https://hk.geek2api.com/api/v1/auth/cli-bridge/start"
    # 系统浏览器打开的授权页面
    browser_url: "https://hk.geek2api.com/cli-bridge"
    # 轮询取回令牌的接口
    poll_url: "https://hk.geek2api.com/api/v1/auth/cli-bridge/poll"
    # 用户资料接口（用于验证登录）
    profile_url: "https://hk.geek2api.com/api/v1/user/profile"
    # Token 刷新接口
    refresh_url: "https://hk.geek2api.com/api/v1/auth/refresh"
    # 轮询间隔（毫秒），默认 3000（3秒），范围 1000-10000
    poll_interval_ms: 3000
    # 最大等待时间（毫秒），默认 300000（5分钟），范围 60000-600000
    max_wait_ms: 300000
    # Token 过期前多少秒开始刷新，默认 300（5分钟）
    refresh_before_expiry_seconds: 300
    # 登录失败后的重试冷却时间（毫秒），默认 5000（5秒）
    retry_cooldown_ms: 5000

# Polymarket 搜索设置（预测市场查询功能）
polymarket:
  # 是否启用 Polymarket 搜索功能，默认 false
  enabled: false
  # Gamma API 基础 URL，用于搜索市场和获取市场详情
  gamma_api_base_url: "https://gamma-api.polymarket.com"
  # CLOB API 基础 URL，用于获取价格历史数据
  clob_api_base_url: "https://clob.polymarket.com"
  # API 查询超时时间（毫秒），默认 30000，范围 5000-120000
  timeout_ms: 30000
  # Polymarket 功能专用 HTTP(S) 代理，同时覆盖 Gamma 与 CLOB 请求；留空表示直连
  # 支持 http://127.0.0.1:7890、https://127.0.0.1:7890，以及 URL 中的可选用户名密码
  proxy: ""
  # Gamma 返回语言，默认 zh；可填 zh、en 等 2-16 位语言标识
  locale: "zh"
  # 关键词匹配字段，默认同时匹配 question 与 description；仅支持这两项
  search_fields: ["question", "description"]
  # 公共事件搜索无相关命中或暂时失败时，每页回退候选市场数量；默认 100，范围 1-500
  search_page_size: 100
  # 市场分页回退最多抓取页数；默认 3，范围 1-20；页数越大回退请求越多
  max_search_pages: 3
  # 命令前缀，默认 "poly"；群消息以此开头时触发搜索
  command_prefix: "poly"
  # 启用的群列表；为空时所有群都可用（需配合 outgoing route 的 groups 过滤）
  enabled_groups: []
  # 强制白名单：只有关键词或官方事件页 URL 中包含下列大模型名称时才允许搜索
  # keywords 为空或缺失时自动回退到同一份内置默认名单，不会变成无限制搜索
  whitelist:
    # 大模型名称、家族名与常用别名；匹配默认忽略大小写，可按需增删
    keywords:
      - "GPT"
      - "ChatGPT"
      - "o1"
      - "o3"
      - "o4-mini"
      - "Claude"
      - "Gemini"
      - "Gemma"
      - "Grok"
      - "DeepSeek"
      - "Qwen"
      - "QwQ"
      - "通义千问"
      - "Llama"
      - "Mistral"
      - "Mixtral"
      - "Kimi"
      - "Moonshot"
      - "豆包"
      - "Doubao"
      - "GLM"
      - "ChatGLM"
      - "智谱"
      - "MiniMax"
      - "海螺"
      - "Hailuo"
      - "ERNIE"
      - "文心一言"
      - "Baichuan"
      - "百川"
      - "Yi-Large"
      - "Yi-Lightning"
      - "零一万物"
      - "Hunyuan"
      - "混元"
      - "阶跃星辰"
      - "Step-1"
      - "Step-2"
      - "Step-3"
      - "Phi"
      - "Command R"
      - "Cohere"
      - "Nova"
    # 是否区分大小写，默认 false
    case_sensitive: false
    # 未命中白名单时的提示，支持 ${keyword} 变量
    reject_message: "仅支持搜索白名单中的大模型相关市场；当前关键词：${keyword}"

  # 可选：关键词提取配置（不配置则使用默认行为：移除 command_prefix 并 trim）
  # keyword_extraction:
  #   # 要移除的前缀列表（按顺序尝试，命中一个即停止）
  #   remove_prefixes: ["poly", "polymarket"]
  #   # 可选正则；填写后取 capture_group 捕获组
  #   pattern: "^(?:poly|polymarket)\\s+(.+)$"
  #   # 正则捕获组编号，默认 1，范围 0-20
  #   capture_group: 1
  #   # 是否 trim 空白，默认 true
  #   trim: true
  #   # 是否转小写，默认 false
  #   lowercase: false
  #   # 是否要求命中前缀，默认 false；命令场景建议 true
  #   require_prefix_match: true

  # 可选：白名单通过后的补充校验；Polymarket 不再支持任何黑名单配置
  # filters:
  #   # 长度验证
  #   length:
  #     # 最小长度，不配置则不限制
  #     min: 2
  #     # 最大长度，不配置则不限制
  #     max: 200
  #     # 拒绝消息模板，支持 ${keyword}、${min}、${max} 变量
  #     reject_message: "关键词长度必须在 ${min}-${max} 之间"
  #   # 正则验证（可选；事件页 URL 场景需允许 URL 中使用的符号）
  #   pattern:
  #     regex: "^[\\p{L}\\p{N} :/?._-]+$"
  #     reject_message: "关键词格式不正确"

  # 可选：响应格式化配置；整个区块不配置时，聚合事件成功结果仍默认发送图片
  # response_format:
  #   # 成功输出模式，默认 image；可选 image（仅图片）、text（旧文本）、both（同一消息内文本+图片）
  #   output_mode: "image"
  #   # 图片渲染、上传或发送失败时是否回退原成功文本，默认 true
  #   image_fallback_to_text: true
  #   # 图片 CSS 画布宽度，默认 1440，范围 900-2400；最终 PNG 以 2 倍倍率输出
  #   image_width_px: 1440
  #   # action 内同名参数 output_mode、image_fallback_to_text、image_width_px 可覆盖这里
  #   # 历史数据最多显示几个点，默认 5，范围 1-20
  #   max_history_points: 5
  #   # 日期格式，默认 "yyyy年MM月dd日"
  #   date_format: "yyyy年MM月dd日"
  #   # 时区，默认 "Asia/Shanghai"
  #   timezone: "Asia/Shanghai"
  #   # 数字是否使用紧凑格式（1.5K、2.3M），默认 true
  #   compact_numbers: true
  #   # 可选：自定义成功响应模板（不配置则使用默认格式化逻辑）。
  #   # 普通市场支持 ${market.question}、${market.category}、${market.volume}、${history}；
  #   # 事件页 URL 还支持 ${event.title}、${eventPageUrl}、${markets}。
  #   # 以及 foreach、if/else、format_number、format_price、format_date。
  #   # success_template: |
  #   #   ${market.question}
  #   #   ${if market.category}分类：${market.category}
  #   #   ${endif}总交易量：$${format_number(market.volume)}
  #   #   ${foreach point in history | limit:5}
  #   #   ${point.date}：是 ${format_price(point.yesPrice)} / 否 ${format_price(point.noPrice)}，${point.probability}%
  #   #   ${if point.volume}交易量：$${format_number(point.volume)}
  #   #   ${endif}${endforeach}
  #   # 可选：自定义无结果消息模板，支持 ${keyword} 变量
  #   # empty_template: "未找到 \"${keyword}\" 的市场"
  #   # 可选：自定义错误消息模板，支持 ${keyword}、${error} 变量
  #   # error_template: "搜索出错：${error}"

# incoming：外部 HTTP 请求触发机器人动作
incoming:
  # 端点列表。每个端点：id 标识、enabled 是否启用、method 请求方法、
  # path 相对 base_path 的子路径、tokens 端点专属 token（为空回退全局）、actions 命中后依次执行的动作
  endpoints:
    - id: "send-group"
      enabled: true
      method: "POST"
      path: "/send-group"
      actions:
        # 发送群消息：group_id 必填且需可解析为数字；message 支持模板，单个 request.body 变量超过 200 字符时会渲染为 Markdown 图片
        - type: "send_group_message"
          group_id: "${request.body.group_id}"
          # at 为目标 QQ，可填单个数字、字符串或列表；为空列表时不 @；仅群消息有效，会生成真正的 Mirai At
          at: []
          # at_all 是否 @全体成员，默认 false；仅群消息有效，需机器人在群内有对应权限
          at_all: false
          # parse_mirai_code 是否将 message 按 MiraiCode 解析，默认 false；开启后可写 [mirai:at:123456]、[mirai:atall] 等
          parse_mirai_code: false
          # mirai_code 可替代 message，填写后会自动按 MiraiCode 解析；示例："[mirai:at:${request.body.target_qq}] ${request.body.message ?: \"\"}"
          # mirai_code: "[mirai:at:${request.body.target_qq}] ${request.body.message ?: \"\"}"
          message: "${request.body.message ?: \"\"}"
        # reply 构造 HTTP 响应：status 状态码（默认 200），body 任意结构
        - type: "reply"
          status: 200
          body:
            success: true
            message: "group message queued"

    - id: "send-friend"
      enabled: true
      method: "POST"
      path: "/send-friend"
      actions:
        # 发送好友消息：friend_id 必填且需可解析为数字；message 支持模板，单个 request.body 变量超过 200 字符时会渲染为 Markdown 图片
        - type: "send_friend_message"
          friend_id: "${request.body.friend_id}"
          # parse_mirai_code 是否将 message 按 MiraiCode 解析，默认 false；好友消息不支持结构化 at 字段
          parse_mirai_code: false
          # mirai_code 可替代 message，填写后会自动按 MiraiCode 解析
          # mirai_code: "${request.body.mirai_code ?: \"\"}"
          message: "${request.body.message ?: \"\"}"
        - type: "reply"
          status: 200
          body:
            success: true
            message: "friend message queued"

    # 同一个网页截图动作也可由 incoming 调用；请求体传 group_id 或 friend_id 指定接收方
    - id: "webpage-screenshot"
      # 默认关闭；启用前需设置 browser.enabled: true，并按请求体提供 group_id 或 friend_id
      enabled: false
      method: "POST"
      path: "/webpage-screenshot"
      # actions 动作组单飞控制；未配置 single_flight 时默认关闭
      single_flight:
        # 开启后，上一轮 actions 未全部结束前拒绝下一次触发
        enabled: true
        # 可选共享键；省略时仅当前 endpoint 互斥，相同键可与其他 endpoint/route 共同互斥
        key: "geek2api-monitor-screenshot"
        # 忙碌时是否返回自定义 message；incoming 无论该值如何都会返回 HTTP 409
        notify: true
        # 支持当前 request/event 模板变量；空字符串可只返回通用 action group busy 错误
        message: "Geek2Api 监控截图任务正在执行，请等待完成后再试。"
      actions:
        - ref: "geek2api-monitor-screenshot"
        - type: "reply"
          status: 200
          body:
            success: true
            message: "webpage screenshot sent"

# outgoing：mirai 消息事件转发到外部 WebHook
outgoing:
  # 路由列表。events/groups/friends/senders/message/condition 之间为「与」关系，未配置的条件跳过；
  # message 内的 contains/starts_with/ends_with/regex 四类之间为「或」关系，任意一项命中即通过文本匹配。
  # single_flight、cooldown 与 actions 在路由匹配通过后依次处理。
  routes:
    - id: "group-message-forward"
      # 示例路由默认关闭，启用前请先填入真实 URL
      enabled: false
      events: ["group_message"]
      groups: [123456789]
      message:
        # contains/starts_with/ends_with/regex 四类均为列表，所有已配置项之间为「或」关系
        contains: ["关键词"]
      actions:
        # http_request：向外部发起 HTTP 请求。method 默认 POST，
        # headers 为键值对，body 任意结构（序列化为 JSON）
        - type: "http_request"
          method: "POST"
          url: "https://example.invalid/webhook/group-message"
          # 当前 http_request 动作专用 HTTP(S) 代理；留空表示直连，不影响其他动作或功能
          # 支持可选用户名密码，例如 http://user:password@127.0.0.1:7890
          proxy: ""
          headers:
            Authorization: "Bearer change-me-token"
          body:
            type: "${event.type}"
            bot_id: "${event.botId}"
            group_id: "${event.groupId}"
            sender_id: "${event.senderId}"
            sender_name: "${event.senderName}"
            message: "${event.messageText}"

    # 群成员发送“监控截图”时截取 Geek2Api 公共状态页，并自动把图片发回当前群
    - id: "geek2api-monitor-command"
      # 默认关闭；启用前需同时开启 browser.enabled 和下方命名动作
      enabled: false
      events: ["group_message"]
      # 使用占位群号，生产环境替换为允许触发截图的群；留空表示不限制群
      groups: [123456789]
      message:
        # 任意满足即触发：消息包含“炸了么”，或以“状态检查”/“监控截图”开头
        contains: ["炸了么"]
        starts_with: ["状态检查", "监控截图"]
      # 动作组单飞在 actions 执行期间持续生效；与 incoming 使用同一 key，避免重复截图
      single_flight:
        # 开启后，上一轮 actions 未全部结束前拒绝下一次触发；未配置区块时默认关闭
        enabled: true
        # 可选共享键；省略时仅按当前 route.id 互斥，相同键可跨 endpoint/route 共同互斥
        key: "geek2api-monitor-screenshot"
        # 被拦截时是否向当前群或好友发送提示，默认 true
        notify: true
        # 提示支持当前 event 模板变量；空字符串可静默拦截
        message: "Geek2Api 监控截图任务正在执行，请等待完成后再试。"
      # 指令冷却仅作用于本路由；未配置 cooldown 时完全不启用
      cooldown:
        # 冷却开关；配置了 cooldown 区块时默认 true
        enabled: true
        # 普通用户个人冷却（毫秒），按发送者 QQ 独立计时；默认 0，范围 0-604800000
        personal_ms: 60000
        # 群管理员/群主或插件管理员的个人冷却（毫秒）；默认继承 personal_ms，范围 0-604800000
        administrator_ms: 10000
        # 本路由所有未绕过用户共享的全局冷却（毫秒）；默认 0，范围 0-604800000
        global_ms: 5000
        # 被冷却拦截时是否向当前群或好友发送提示，默认 true
        notify: true
        # 提示支持 cooldown.routeId/scope/remainingMillis/remainingSeconds 变量
        message: "监控截图指令冷却中，请在 ${cooldown.remainingSeconds} 秒后重试。"
      actions:
        - ref: "geek2api-monitor-screenshot"

    # 群成员发送“降智检测”时抓取 Codex 雷达数据，回复建议文本并附上重绘图表
    - id: "codex-degradation-command"
      # 默认开启；本路由只做 HTTP 拉取与本地绘图，不依赖 browser.enabled
      enabled: true
      events: ["group_message"]
      # 留空表示不限制群；生产环境可填入允许触发的群号列表
      groups: []
      message:
        # 任意满足即触发
        contains: ["降智检测"]
        starts_with: ["降智检测", "智商检测"]
      # 单飞避免同一时间重复抓取与重复绘图
      single_flight:
        enabled: true
        key: "codex-degradation-report"
        notify: true
        message: "降智检测正在执行，请等待完成后再试。"
      cooldown:
        enabled: true
        # 数据源每约 4 小时更新一次观察点，个人冷却设为 120 秒足够
        personal_ms: 120000
        administrator_ms: 15000
        global_ms: 10000
        notify: true
        message: "降智检测冷却中，请在 ${cooldown.remainingSeconds} 秒后重试。"
      actions:
        - ref: "codex-degradation-report"

    # Model Plaza 查询：群成员发送"模型 <关键词>"时匹配所有包含关键词的分组，并分别列出各分组模型
    - id: "model-plaza-query-models"
      # 默认关闭；启用前需设置 model_plaza.enabled: true
      enabled: false
      events: ["group_message"]
      # 使用占位群号，生产环境替换为允许触发查询的群；留空表示不限制群
      groups: [123456789]
      message:
        # 消息以"模型"开头时触发，例如："模型 OpenAI"、"模型 gpt"
        starts_with: ["模型"]
      single_flight:
        enabled: true
        key: "model-plaza-query"
        notify: true
        message: "模型查询正在执行，请稍候..."
      cooldown:
        enabled: true
        personal_ms: 10000
        administrator_ms: 5000
        global_ms: 3000
        notify: true
        message: "查询冷却中，请在 ${cooldown.remainingSeconds} 秒后重试。"
      actions:
        # query_model_plaza_models 会自动从 event.messageText 提取关键词
        # 例如 "模型 gpt" -> 分别列出 gpt、gptpro、gpt-Azure 等命中分组及其模型
        - type: "query_model_plaza_models"
          # 可选：覆盖 model_plaza.proxy；省略时继承功能级代理，显式留空则本动作直连
          # proxy: "http://127.0.0.1:7890"
          # 可选：显式指定查询关键词（支持模板变量）
          # query_pattern: "${event.messageText}"
          # 可选：查询进行中提示
          pending_message: "正在查询分组模型，请稍候..."
          # 可选：查询失败提示
          failure_message: "查询失败，请稍后重试"
          # 可选：无结果提示
          empty_message: "未找到包含该关键词的分组"

    # Model Plaza 查询：群成员发送"分组 <关键词>"时匹配所有包含关键词的模型，并分别列出各模型分组
    - id: "model-plaza-query-groups"
      # 默认关闭；启用前需设置 model_plaza.enabled: true
      enabled: false
      events: ["group_message"]
      # 使用占位群号，生产环境替换为允许触发查询的群；留空表示不限制群
      groups: [123456789]
      message:
        # 消息以"分组"开头时触发，例如："分组 gpt-4"、"分组 claude"
        starts_with: ["分组"]
      single_flight:
        enabled: true
        key: "model-plaza-query"
        notify: true
        message: "分组查询正在执行，请稍候..."
      cooldown:
        enabled: true
        personal_ms: 10000
        administrator_ms: 5000
        global_ms: 3000
        notify: true
        message: "查询冷却中，请在 ${cooldown.remainingSeconds} 秒后重试。"
      actions:
        # query_model_plaza_groups 会自动从 event.messageText 提取关键词
        # 例如 "分组 gpt" -> 分别列出所有名称包含 gpt 的模型及其所属分组
        - type: "query_model_plaza_groups"
          # 可选：覆盖 model_plaza.proxy；省略时继承功能级代理，显式留空则本动作直连
          # proxy: "http://127.0.0.1:7890"
          # 可选：显式指定查询关键词（支持模板变量）
          # query_pattern: "${event.messageText}"
          # 可选：查询进行中提示
          pending_message: "正在查询模型分组，请稍候..."
          # 可选：查询失败提示
          failure_message: "查询失败，请稍后重试"
          # 可选：无结果提示
          empty_message: "未找到包含该关键词的模型"

    # Polymarket 搜索：群成员发送"poly <关键词>"时搜索并返回市场信息；也支持
    # "poly https://polymarket.com/zh/event/<slug>"，此时按事件页返回全部开放子市场摘要。
    - id: "polymarket-search-command"
      # 默认关闭；启用前需设置 polymarket.enabled: true
      enabled: false
      events: ["group_message"]
      # 使用占位群号，生产环境替换为允许触发搜索的群；留空表示不限制群
      groups: [123456789]
      message:
        # 消息以"poly"开头时触发，例如："poly GPT-6"、"poly bitcoin"
        starts_with: ["poly", "polymarket"]
      single_flight:
        enabled: true
        key: "polymarket-search"
        notify: true
        message: "Polymarket 搜索正在执行，请稍候..."
      cooldown:
        enabled: true
        personal_ms: 15000
        administrator_ms: 5000
        global_ms: 5000
        notify: true
        message: "搜索冷却中，请在 ${cooldown.remainingSeconds} 秒后重试。"
      actions:
        # polymarket_search 会自动从 event.messageText 提取关键词
        # 例如 "poly GPT-6" -> 搜索包含 GPT-6 的市场
        - type: "polymarket_search"
          # 可选：覆盖 polymarket.proxy；省略时继承功能级代理，显式留空则本动作直连
          # proxy: "http://127.0.0.1:7890"
          # 可选：显式指定搜索关键词（支持模板变量）
          # keyword: "${event.messageText}"
          # 可选：搜索进行中提示
          pending_message: "正在搜索 Polymarket 市场，请稍候..."
          # 可选：搜索失败提示
          failure_message: "搜索失败，请稍后重试"
          # 聚合事件成功结果发送模式：image 仅图片、text 旧文本、both 文本和图片；默认 image
          output_mode: "image"
          # 图片渲染、上传或发送失败时回退原成功文本，默认 true
          image_fallback_to_text: true
          # 图片 CSS 画布宽度，范围 900-2400；最终 PNG 以 2 倍倍率输出
          image_width_px: 1440

    - id: "friend-message-forward"
      enabled: false
      events: ["friend_message"]
      actions:
        - type: "http_request"
          method: "POST"
          url: "https://example.invalid/webhook/friend-message"
          body:
            type: "${event.type}"
            bot_id: "${event.botId}"
            friend_id: "${event.friendId}"
            sender_id: "${event.senderId}"
            sender_name: "${event.senderName}"
            message: "${event.messageText}"

# actions：可复用的命名动作，incoming/outgoing 可用字符串名或 ref 引用
actions:
  # 降智检测：抓取 Codex 雷达数据，输出每个模型的换档建议，并重绘图表发送到会话
  codex-degradation-report:
    type: "send_codex_radar_report"
    # 默认开启；本动作仅做 HTTP 拉取与本地 HTML 绘图，不需要 browser.enabled
    enabled: true
    # 智力效率主数据源（静态快照，schema=2，约 370KB）。
    # points 为 19 个「模型 × 思考档位」聚合点，含 iq、均价、均耗时与综合成本指数，
    # 是站点「智力效率」面板的数据源，也是本动作 IQ 与评级的唯一主数据。
    efficiency_url: "https://codexradar.com/data/intelligence-efficiency.json?refresh=1"
    # 洞察接口（约 29KB）。提供 recommendations 站长推荐分组，
    # 以及 degradation_alerts 降智预警（每个档位只与自身 24h/48h 历史比较得出）。
    insights_url: "https://codexradar.com/api/radar-insights?refresh=1"
    # 说明：https://codexradar.com/api/intelligence-efficiency?refresh=1 是原始逐题评测矩阵
    # （约 1.9MB，含 tasks/cells/combos 与每次跑分的贡献者明细）。
    # 聚合结论已由上面两个接口提供，故本动作默认不拉取该接口，避免每次触发传输 1.9MB。
    # 当前 Codex 动作专用 HTTP(S) 代理；留空表示直连，不影响其他动作或功能。
    # 支持 http://127.0.0.1:7890、https://127.0.0.1:7890，以及 URL 中的可选用户名密码。
    # 注意：codexradar.com 在部分网络环境下仅 IPv6 可达，而 JVM 默认优先 IPv4，
    # 表现为 connect timeout。若日志报连接超时，可在此填入可用代理，
    # 或给 mirai 启动参数加上 -Djava.net.preferIPv6Addresses=true。
    proxy: ""
    # incoming 可通过请求体指定群号；outgoing 中变量为空时自动回退到触发事件所在会话
    group_id: "${request.body.group_id}"
    # incoming 可通过请求体指定好友号；group_id 和 friend_id 不能同时有效
    friend_id: "${request.body.friend_id}"
    # 开始抓取前的提示语，留空则不发送
    pending_message: "正在检测 Codex 各模型智商状态..."
    # 抓取或绘图失败时发送的脱敏提示，详细原因仅写控制台日志
    failure_message: "降智检测失败，请稍后重试。"
    # 是否包含文本建议，默认 true
    # 注意：send_text 与 send_chart 的结果会合并为同一条消息发送，
    # 两者都为 true 时消息内为「建议文本 + 图表图片」；两者都为 false 时不发送任何消息
    send_text: true
    # 是否包含重绘的图表图片，默认 true
    send_chart: true
    # 文本建议的首行，默认“建议：”
    advice_header: "建议："
    # 降智判定参数
    advice:
      # 判定「智商正常」的 IQ 下限，默认 90（对齐站点推荐规则的性价比位下限）
      target_iq: 90
      # 评级「优秀」的 IQ 下限，默认 96（对齐站点推荐规则的聪明位下限）
      excellent_iq: 96
      # 评级「正常」的 IQ 下限，默认跟随 target_iq，保持评级与判定口径一致
      normal_iq: 90
      # 评级「观察」的 IQ 下限，低于该值记为「偏低」，默认 80
      watch_iq: 80
      # 作为日常基准的思考档位，默认 high；该档位达标且无降智预警即判定为智商正常
      baseline_effort: "high"
      # 建议档位选取策略：highest 取该模型最高档位（默认），cheapest 取达标且综合成本最低的档位
      strategy: "highest"
      # 建议文本模板。{model} 为模型名，{effort} 为思考档位中文名，
      # {effort_official} 为 OpenAI 官方档位名（即 reasoning effort 取值）
      normal_template: "{model} 智商正常。"
      switch_template: "{model}：建议换{effort}（{effort_official}）。"
      # 全部档位都达不到 target_iq 时使用
      degraded_template: "{model}：全档位降智，建议换{effort}（{effort_official}）或暂避。"
      # 该模型无任何档位数据时使用
      unknown_template: "{model}：暂无数据。"
    # 展示名与档位映射
    labels:
      # 思考档位从低到高的顺序，用于 highest 策略与卡片排序
      effort_order: ["low", "medium", "high", "xhigh", "max", "ultra"]
      # 思考档位中文名，键为接口返回的 effort 原值
      effort:
        low: "轻度思考"
        medium: "中度思考"
        high: "高度思考"
        xhigh: "极高思考"
        max: "极致思考"
        ultra: "超限思考"
      # 思考档位的 OpenAI 官方名，即 reasoning effort 取值。
      # 该值可直接填入 Codex CLI 的 model_reasoning_effort 或 API 请求参数，
      # 因此图表卡片与建议文本会在中文名旁同时给出官方名，便于直接照抄。
      # 默认与接口返回的 effort 原值一致；如需改为大写或加前缀可在此覆盖。
      effort_official:
        low: "low"
        medium: "medium"
        high: "high"
        xhigh: "xhigh"
        max: "max"
        ultra: "ultra"
      # 模型展示名，键为接口返回的 model 原值
      model:
        gpt-5.6-sol: "GPT-5.6 Sol"
        gpt-5.6-terra: "GPT-5.6 Terra"
        gpt-5.6-luna: "GPT-5.6 Luna"
        gpt-5.5: "GPT-5.5"
      # 模型在图表与建议中的展示顺序；未列出的模型按名称排在其后
      model_order: ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna", "gpt-5.5"]
    # 图表外观
    chart:
      # 图表主标题
      title: "Codex 降智检测"
      # 副标题
      subtitle: "CODEX INTELLIGENCE RADAR · 社区真实任务盲测"
      # 建议区块标题
      advice_title: "建议"
      # 页脚免责说明
      footer: "数据来自 Codex 雷达 codexradar.com · 分数由社区盲测汇总，不代表官方结论"
      # 图表渲染宽度（像素），默认 1680，范围 900-3000；实际输出为 2 倍超采样
      width_px: 1680

  # Geek2Api 公共状态页截图示例；/status 无需登录，可查看渠道状态和各 URL 端点延迟
  geek2api-monitor-screenshot:
    type: "send_webpage_screenshot"
    # 默认开启；启用前需同时设置 browser.enabled: true
    enabled: true
    # 公共状态页候选基址；当前 URL 成功时保持使用，仅在请求或导航失败后切换下一项
    # 五个香港节点都提供相同的 /status 页面，列表顺序即 failover 顺序
    base_urls:
      - "https://hk.geek2api.com"
      - "https://hk2.geek2api.com"
      - "https://hk3.geek2api.com"
      - "https://hk4.geek2api.com"
      - "https://hk5.geek2api.com"
    # incoming 可通过请求体指定群号；outgoing 中变量为空时自动回退到触发事件所在会话
    group_id: "${request.body.group_id}"
    # incoming 可通过请求体指定好友号；group_id 和 friend_id 不能同时有效
    friend_id: "${request.body.friend_id}"
    # /status 为公开页面，不会打开登录或 CLI Bridge 授权窗口
    pending_message: "正在获取 Geek2Api 公共状态页截图..."
    # 截图失败时发送给聊天用户的脱敏提示，内部详细原因仅写控制台日志
    failure_message: "Geek2Api 公共状态页截图失败，请稍后重试。"
    # 图片前的可选说明文字，留空时只发送图片
    message: ""
    # 公共页面无需 auth；每个截图项使用独立 Page，并复用同一无登录 BrowserContext
    screenshot:
      # 截图项列表，按配置顺序从上到下拼接；默认至少 1 项、最多 16 项
      # 每项支持 id、enabled、url、wait_until、steps、selector、timeout_ms、delay_before_ms、font_wait_timeout_ms、hide_selectors
      parts:
        # 截取完整 /status 主内容，包含页面概览、URL 端点延迟和全部渠道状态
        # 保留 monitor-status id，兼容依赖浏览器文本查询 API 的现有插件
        - id: "monitor-status"
          # 单项开关，默认 true；false 时整项跳过，至少需保留一个启用项
          enabled: true
          # 会随 base_urls 保留 /status 路径，并在当前域名不可用时切换下一候选
          url: "https://hk.geek2api.com/status"
          # url 导航等待阶段，默认 commit；可选 commit/domcontentloaded/load/networkidle
          wait_until: "commit"
          steps:
            # 至少一个端点按钮出现，确保 URL 端点列表已经挂载
            - op: "wait"
              selector: '//*[@id="app"]/div[2]/main/section[2]/div[2]/div[1]/button'
              state: "visible"
              timeout_ms: 60000
            # 第一张真实渠道卡片或合法空状态出现，确保公共监控数据已经完成首次加载
            - op: "wait"
              selector: '(//*[@id="app"]/div[2]/main/div/div/div/button[1] | //*[@id="app"]/div[2]/main//div[contains(concat(" ", normalize-space(@class), " "), " empty-state ")])[1]'
              state: "visible"
              timeout_ms: 60000
          # header 位于 main 外部但使用 fixed 定位；截图时需临时隐藏，避免覆盖 main 顶部
          selector: '//*[@id="app"]/div[2]/main'

      # 以下四项是所有 parts 的默认值；单项配置同名字段时覆盖默认值
      # 完成导航和两项就绪等待后，再等待 3 秒，让端点测速和渠道数据稳定
      delay_before_ms: 3000
      # 截图元素等待与截图操作超时，单位毫秒；默认回退 browser.timeout_ms，范围 100-300000
      timeout_ms: 60000
      # 字体或第三方资源未结束时最多等待 3 秒，然后使用当前渲染结果继续截图
      font_wait_timeout_ms: 3000
      # /status 当前页头是 fixed header，不含 sticky 类；截图 main 时按实际 DOM 选择器隐藏
      hide_selectors: ["#app header"]
      # 纵向合成布局；未配置 layout 时默认居中且无间距
      layout:
        # 宽度不同时的水平对齐方式：left、center、right，默认 center
        horizontal_align: "center"
        # 相邻截图项之间的透明间距像素，默认 0，范围 0-1000
        gap_px: 0
      # 任一截图项步骤或截图发生可重试错误时，重新执行完整 parts 列表
      retry:
        # 重试开关；未配置 retry 区块时默认关闭，配置区块后默认 true
        enabled: true
        # 首次失败后的最大额外重试次数，默认 2，范围 0-10；2 表示最多共尝试 3 次
        max_retries: 2
        # 两次尝试之间的固定等待时间（毫秒），默认 1000，范围 0-60000
        delay_ms: 1000

  # 命令执行动作示例，默认 enabled: false 且需开启 security.allow_command_execution 才会执行
  disabled-command-example:
    type: "execute_command"
    enabled: false
    command: "say WebHook command execution is disabled by default"
